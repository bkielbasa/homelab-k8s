{{- if .Values.backup.enabled }}
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: {{ .Values.cluster.name }}-store
  namespace: {{ .Release.Namespace }}
spec:
  configuration:
    destinationPath: s3://{{ .Values.backup.bucket }}{{- if .Values.backup.path }}/{{ .Values.backup.path }}{{- end }}
    {{- if .Values.backup.endpointURL }}
    endpointURL: {{ .Values.backup.endpointURL }}
    {{- end }}
    {{- if .Values.backup.region }}
    s3Credentials:
      accessKeyId:
        name: {{ .Values.backup.credentialsSecretName }}
        key: ACCESS_KEY_ID
        namespace: {{ .Values.backup.credentialsSecretNamespace }}
      secretAccessKey:
        name: {{ .Values.backup.credentialsSecretName }}
        key: SECRET_ACCESS_KEY
        namespace: {{ .Values.backup.credentialsSecretNamespace }}
    {{- else }}
    s3Credentials:
      accessKeyId:
        name: {{ .Values.backup.credentialsSecretName }}
        key: ACCESS_KEY_ID
        namespace: {{ .Values.backup.credentialsSecretNamespace }}
      secretAccessKey:
        name: {{ .Values.backup.credentialsSecretName }}
        key: SECRET_ACCESS_KEY
        namespace: {{ .Values.backup.credentialsSecretNamespace }}
    {{- end }}
    wal:
      compression: gzip
    data:
      compression: gzip
  retentionPolicy: "30d"
{{- end }}

---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.cluster.name }}
  namespace: {{ .Release.Namespace }}
spec:
  instances: {{ .Values.cluster.instances }}

  imageName: {{ .Values.cluster.imageName }}

  storage:
    size: {{ .Values.cluster.storage.size }}
    storageClass: {{ .Values.cluster.storage.storageClass }}

  {{- if .Values.backup.enabled }}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ .Values.cluster.name }}-store
  {{- end }}

  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "256MB"

  monitoring:
    enablePodMonitor: false
  bootstrap:
    initdb:
      database: app
      owner: app
{{- end }}

{{- if and .Values.backup.enabled .Values.scheduledBackup.enabled }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ .Values.cluster.name }}-daily
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ .Values.scheduledBackup.schedule | quote }}
  backupOwnerReference: {{ .Values.scheduledBackup.backupOwnerReference }}
  immediate: {{ .Values.scheduledBackup.immediate }}
  cluster:
    name: {{ .Values.cluster.name }}
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
{{- end }}
