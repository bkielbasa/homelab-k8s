apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "infra-guy.fullname" . }}-worker-dispatcher
  labels:
    {{- include "infra-guy.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "infra-guy.fullname" . }}-worker-dispatcher
  labels:
    {{- include "infra-guy.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "infra-guy.fullname" . }}-worker-dispatcher
subjects:
  - kind: ServiceAccount
    name: {{ include "infra-guy.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
