apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "infra-guy.fullname" . }}
  labels:
    {{- include "infra-guy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "infra-guy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "infra-guy.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "infra-guy.serviceAccountName" . }}
      initContainers:
        - name: wait-db
          image: {{ .Values.postgres.image }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until pg_isready -h {{ include "infra-guy.fullname" . }}-db -U {{ .Values.postgres.user }}; do sleep 2; done
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: {{ .Values.envSecret }}
          env:
            - name: DATABASE_URL
              value: "postgres://{{ .Values.postgres.user }}:$(POSTGRES_PASSWORD)@{{ include "infra-guy.fullname" . }}-db:5432/{{ .Values.postgres.database }}?sslmode=disable"
            - name: PUBLIC_BASE_URL
              value: {{ .Values.publicBaseURL | quote }}
            - name: GITHUB_APP_PRIVATE_KEY_FILE
              value: /run/secrets/infra-guy/GITHUB_APP_PRIVATE_KEY
            - name: HTTP_ADDR
              value: ":8080"
            - name: WORK_DIR
              value: /data
            - name: WORKER_MODE
              value: {{ (.Values.worker).mode | default "k8s" | quote }}
            - name: WORKER_IMAGE
              value: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
            - name: WORKER_IMAGE_PULL_POLICY
              value: {{ .Values.image.pullPolicy | quote }}
            - name: WORKER_K8S_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: WORKER_SERVICE_ACCOUNT
              value: {{ include "infra-guy.serviceAccountName" . | quote }}
            - name: WORKER_ENV_SECRET
              value: {{ .Values.envSecret | quote }}
            - name: INTERNAL_BASE_URL
              value: "http://{{ include "infra-guy.fullname" . }}:{{ .Values.service.port }}"
          volumeMounts:
            - name: work
              mountPath: /data
            - name: env-secret
              mountPath: /run/secrets/infra-guy
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: work
          persistentVolumeClaim:
            claimName: {{ include "infra-guy.fullname" . }}-work
        - name: env-secret
          secret:
            secretName: {{ .Values.envSecret }}
