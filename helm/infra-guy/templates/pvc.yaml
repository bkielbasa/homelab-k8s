apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "infra-guy.fullname" . }}-work
  labels:
    {{- include "infra-guy.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode | quote }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.persistence.workSize | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "infra-guy.fullname" . }}-db
  labels:
    {{- include "infra-guy.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode | quote }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.postgres.storage | quote }}
