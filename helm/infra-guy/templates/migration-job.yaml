apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "infra-guy.fullname" . }}-migrate
  labels:
    {{- include "infra-guy.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "argocd.argoproj.io/hook": PreSync
    "argocd.argoproj.io/hook-delete-policy": BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/name: {{ include "infra-guy.name" . }}-migrate
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrate
    spec:
      serviceAccountName: {{ include "infra-guy.serviceAccountName" . }}
      restartPolicy: OnFailure
      initContainers:
        - name: wait-db
          image: {{ .Values.postgres.image }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until pg_isready -h {{ include "infra-guy.fullname" . }}-db -U {{ .Values.postgres.user }}; do sleep 2; done
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /usr/local/bin/migrate
            - up
          envFrom:
            - secretRef:
                name: {{ .Values.envSecret }}
          env:
            - name: DATABASE_URL
              value: "postgres://{{ .Values.postgres.user }}:$(POSTGRES_PASSWORD)@{{ include "infra-guy.fullname" . }}-db:5432/{{ .Values.postgres.database }}?sslmode=disable"
