image:
  repository: bartlomiejklimczak/workspace
  tag: v0.0.16
  pullPolicy: Always

ingress:
  enabled: true
  className: nginx
  host: mail.cloudlift.run
  extraHosts:
    - autodiscover.cloudlift.run
    - autoconfig.cloudlift.run
    # cloudlift.pl is a hosted mail domain too, so its clients need the same
    # discovery hosts and, because IMAPS/SMTPS present this certificate,
    # mail.cloudlift.pl has to be a SAN or TLS verification fails there.
    - mail.cloudlift.pl
    - autodiscover.cloudlift.pl
    - autoconfig.cloudlift.pl
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-dns
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

tls:
  enabled: true
  secretName: workspace-tls
  clusterIssuer: letsencrypt-prod-dns

dkim:
  enabled: false
  secretName: workspace-dkim
  domain: cloudlift.pl
  selector: default

# canonical host advertised by autoconfig/autodiscover responses
mailHost: mail.cloudlift.run

# workspace-db Secret must exist in the workspace namespace before install.
# Create it with:
#   kubectl create secret generic workspace-db \
#     --from-literal=DATABASE_URL='postgres://...' \
#     -n workspace
# Or manage via Vault + External Secrets (see terraform/services/workspace.tf).
databaseUrlSecret:
  name: workspace-db
  key: DATABASE_URL

mailService:
  enabled: true
  type: LoadBalancer
  annotations:
    metallb.universe.tf/address-pool: mail-ip-pool
    metallb.universe.tf/loadBalancerIPs: 192.168.1.31
  ports:
    smtp:
      port: 25
      targetPort: 2525
    smtps:
      port: 465
      targetPort: 2465
    imap:
      port: 143
      targetPort: 1143
    imaps:
      port: 993
      targetPort: 1993

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi
