image:
  repository: bartlomiejklimczak/workspace
  tag: v0.0.98
  pullPolicy: Always

ingress:
  enabled: true
  className: nginx
  host: mail.cloudlift.run
  appHosts:
    - cloudlift.run
  extraHosts:
    - autodiscover.cloudlift.run
    - autoconfig.cloudlift.run
    # Serves CardDAV and CalDAV over HTTPS. The mail host cannot: on the LAN
    # it resolves to the mail load balancer, which has no HTTPS port.
    - dav.cloudlift.run
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-dns
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # WebDAV uploads bypass nginx's 1m default body limit.
    nginx.ingress.kubernetes.io/proxy-body-size: "0"

tls:
  enabled: true
  secretName: workspace-tls
  clusterIssuer: letsencrypt-prod-dns

dkim:
  enabled: false
  secretName: workspace-dkim
  domain: cloudlift.run
  selector: default

# canonical host advertised by autoconfig/autodiscover responses
mailHost: mail.cloudlift.run

# OIDC sign-in through Authentik. clientSecret comes from the workspace-sso
# ExternalSecret (Vault secret/oidc/workspace), created in
# terraform/services/workspace.tf.
sso:
  enabled: true
  issuer: https://authentik.klimczak.xyz/application/o/workspace/
  clientID: workspace
  clientSecretSecret:
    name: workspace-sso
    key: OIDC_CLIENT_SECRET
  providerName: Authentik
  redirectURL: https://mail.cloudlift.run/login/sso/callback
  autoCreate: true

# host advertised for CardDAV and CalDAV
davHost: dav.cloudlift.run

# workspace-db Secret must exist in the workspace namespace before install.
# Create it with:
#   kubectl create secret generic workspace-db \
#     --from-literal=DATABASE_URL='postgres://...' \
#     -n workspace
# Or manage via Vault + External Secrets (see terraform/services/workspace.tf).
databaseUrlSecret:
  name: workspace-db
  key: DATABASE_URL

mailService:
  enabled: true
  type: LoadBalancer
  annotations:
    metallb.universe.tf/address-pool: mail-ip-pool
    metallb.universe.tf/loadBalancerIPs: 192.168.1.31
  ports:
    smtp:
      port: 25
      targetPort: 2525
    submission:
      port: 587
      targetPort: 2587
    smtps:
      port: 465
      targetPort: 2465
    imap:
      port: 143
      targetPort: 1143
    imaps:
      port: 993
      targetPort: 1993

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    # ffmpeg decodes iPhone HEVC MOVs for gallery posters in-process; a
    # 1080p clip spikes well past 256Mi, and the OOM killer eats the job.
    memory: 1Gi
