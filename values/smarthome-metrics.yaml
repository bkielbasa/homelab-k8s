image:
  repository: bartlomiejklimczak/smarthome-metrics
  pullPolicy: IfNotPresent
  tag: "1.0.1"
  
service:
  type: NodePort
  nodePort: 30088 # Optional: fixed port (30000-32767), or omit to auto-assign

database:
  host: "postgresql.postgresql.svc.cluster.local"
  port: 5432
  user: "homelabmetrics"
  name: "homelabmetrics"
  # DATABASE_URL is synced into the smarthome namespace by the
  # smarthome-metrics-db ExternalSecret (see
  # terraform/services/smarthome-metrics.tf). A secretKeyRef cannot cross
  # namespaces, so the credentials are materialised here rather than read
  # in place from the postgresql namespace — `existingSecret` must be a bare
  # name, never "namespace/name".
  existingSecret: smarthome-metrics-env
  urlSecretKey: DATABASE_URL

