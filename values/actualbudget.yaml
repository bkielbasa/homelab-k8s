persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 5Gi

# SSO via Authentik. clientId/clientSecret are read from the
# `actualbudget-oidc` Secret, synced from Vault by ExternalSecret — see
# terraform/services/actualbudget-vault.tf (the secret was previously
# injected via helm_release.set_sensitive, which Argo cannot do).
# enforce=false keeps password login as a fallback in case OIDC breaks.
login:
  method: openid
  allowedLoginMethods:
    - password
    - openid
  openid:
    enforce: false
    providerName: "Authentik"
    discoveryUrl: "https://authentik.klimczak.xyz/application/o/actualbudget/.well-known/openid-configuration"
    clientId: "actualbudget"
    existingSecret:
      name: actualbudget-oidc
      clientIdKey: clientId
      clientSecretKey: clientSecret

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    cert-manager.io/cluster-issuer: "letsencrypt-prod-dns"
  hosts:
    - host: budget.klimczak.xyz
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - budget.klimczak.xyz
      secretName: actualbudget-tls
