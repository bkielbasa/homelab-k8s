auth:
  enabled: false

primary:
  podAnnotations:
    linkerd.io/inject: disabled
  containerSecurityContext:
    # Zwiększ limit file descriptorów
    capabilities:
      add:
        - SYS_RESOURCE
  persistence:
    enabled: true
    storageClass: qnap-nfs

replica:
  podAnnotations:
    linkerd.io/inject: disabled
  persistence:
    enabled: true
    storageClass: qnap-nfs
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

master:
  extraEnvVars:
    - name: VALKEY_MAXCLIENTS
      value: "10000"
