loki:
  auth_enabled: false
  
  commonConfig:
    replication_factor: 1
  
  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  
  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules
  
  limits_config:
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    retention_period: 744h
    # Let the delete API rewrite matching lines out of existing chunks.
    deletion_mode: filter-and-delete

  # Without a compactor block Loki silently ignores retention_period and
  # answers the delete API with a 404, so neither policy was in force.
  compactor:
    working_directory: /var/loki/compactor
    delete_request_store: filesystem
    retention_enabled: true
    # Grace window in which a delete request can still be cancelled;
    # the default 24h would stall an urgent purge for a day.
    delete_request_cancel_period: 1m

  # Match the "entry too far behind" cutoff to reject_old_samples_max_age.
  # Loki rejects entries older than max_chunk_age/2, so a 2h default => 1h cutoff,
  # which silently dropped backfill from Alloy restarts. 168h*2 keeps the two
  # policies consistent.
  ingester:
    max_chunk_age: 336h

deploymentMode: SingleBinary

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
    storageClass: "qnap-nfs"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

chunksCache:
  enabled: false
  replicas: 0

resultsCache:
  enabled: false
  replicas: 0

lokiCanary:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 32Mi

gateway:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

# Disable Promtail (deprecated)
promtail:
  enabled: false

grafana:
  enabled: false
