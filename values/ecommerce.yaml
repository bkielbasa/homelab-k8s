image:
  repository: bartlomiejklimczak/ecommerce
  tag: v0.1.0
  pullPolicy: IfNotPresent

# The app binds 8080 (SERVER_PORT default). Change here (not in the chart) if
# the image's listen port changes.
service:
  port: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-dns
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: demo.klimczak.xyz
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - demo.klimczak.xyz
      secretName: ecommerce-tls

# Env comes from the `ecommerce-env` Secret, which external-secrets populates
# from Vault's `secret/data/ecommerce`. The app reads discrete lib/pq-style
# vars (not DATABASE_URL). Requires, in Vault:
#   POSTGRES_HOST=postgresql.postgresql.svc.cluster.local
#   POSTGRES_PORT=5432
#   POSTGRES_USER=ecommerce
#   POSTGRES_PASSWORD=<role password>
#   POSTGRES_DB=ecommerce
#   SESSION_SECRET=<openssl rand -base64 32>   # app refuses the insecure default in prod
# (role/db already exist; see ./psql_create_db.sh ecommerce)
envSecret:
  create: false

# /health answers before the DB is reachable, so the pod doesn't crash-loop
# while migrations or credentials are still being sorted out.
livenessProbe:
  httpGet:
    path: /healthyz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 512Mi
