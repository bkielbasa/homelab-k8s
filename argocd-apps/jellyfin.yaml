apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: jellyfin
  # Upstream chart + root-level values/ via $values (the values file lives
  # outside any chart dir). Version pinned to the release currently running.
  # The config/media PVCs live at the repo root (jellyfin-*-pvc/pv.yaml),
  # outside the chart, so Argo does not manage them.
  sources:
    - repoURL: https://jellyfin.github.io/jellyfin-helm
      chart: jellyfin
      targetRevision: 3.2.0
      helm:
        valueFiles:
          - $values/values/jellyfin.yaml
    - repoURL: https://github.com/bkielbasa/homelab-k8s
      targetRevision: master
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
