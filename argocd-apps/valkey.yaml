apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: valkey
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: valkey
  # Upstream chart + root-level values/ via $values (the values file lives
  # outside any chart dir). Version pinned to the release currently running.
  sources:
    - repoURL: https://charts.bitnami.com/bitnami
      chart: valkey
      targetRevision: 5.0.1
      helm:
        valueFiles:
          - $values/values/valkey.yaml
    - repoURL: https://github.com/bkielbasa/homelab-k8s
      targetRevision: master
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
