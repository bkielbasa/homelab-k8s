apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-guy
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: infra-guy
  sources:
    - repoURL: https://github.com/bkielbasa/homelab-k8s
      targetRevision: master
      path: helm/infra-guy
      helm:
        valueFiles:
          - $values/values/infra-guy.yaml
    - repoURL: https://github.com/bkielbasa/homelab-k8s
      targetRevision: master
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
